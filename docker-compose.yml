services:
  # MySQL database for users and queue entries.
  # Host: localhost:3310
  # Docker network: db:3306
  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "3310:3306"
    volumes:
      # Database data remains after `docker compose down`.
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Registration, sign-in, JWT creation, and staff seeding.
  auth:
    build: ./auth-service
    container_name: auth
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE}"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS}"
      STAFF_SEED_ENABLED: "${STAFF_SEED_ENABLED}"
      STAFF_SEED_USERNAME: "${STAFF_SEED_USERNAME}"
      STAFF_SEED_EMAIL: "${STAFF_SEED_EMAIL}"
      STAFF_SEED_PASSWORD: "${STAFF_SEED_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  # Queue operations and WebSocket updates.
  queue:
    build: ./queue-service
    container_name: queue
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE}"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      db:
        condition: service_healthy

  # Public backend entry point.
  gateway:
    build: ./api-gateway
    container_name: gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL}"
      QUEUE_SERVICE_URL: "${QUEUE_SERVICE_URL}"
      QUEUE_SERVICE_WS_URL: "${QUEUE_SERVICE_WS_URL}"
      JWT_SECRET: "${JWT_SECRET}"
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - queue

  # Vite frontend development server.
  frontend:
    image: node:20-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      VITE_API_PROXY_TARGET: "${VITE_API_PROXY_TARGET}"
    depends_on:
      - gateway

volumes:
  db-data: