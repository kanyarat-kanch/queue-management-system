spring:
  application:
    # Service name shown in logs and Spring application metadata.
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Public authentication routes.
        # Users can register and sign in without a JWT.
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**

        # Public queue board.
        # Anyone can view the currently waiting queue.
        - id: queue-status-public
          uri: ${QUEUE_SERVICE_URL}
          predicates:
            - Path=/api/queue/status
            - Method=GET

        # Customer queue routes.
        # The gateway validates the JWT before forwarding the request.
        - id: queue-service
          uri: ${QUEUE_SERVICE_URL}
          predicates:
            - Path=/api/queue/**
          filters:
            - name: JwtAuthFilter

        # Staff-only queue routes.
        # The gateway validates the JWT and requires the STAFF role.
        - id: staff-service
          uri: ${QUEUE_SERVICE_URL}
          predicates:
            - Path=/api/staff/**
          filters:
            - name: JwtAuthFilter
            - name: RoleFilter
              args:
                requiredRole: STAFF

        # WebSocket route for real-time queue notifications.
        # A ws:// URI is required for WebSocket upgrade requests.
        - id: queue-websocket
          uri: ${QUEUE_SERVICE_WS_URL}
          predicates:
            - Path=/ws/**

jwt:
  # Shared secret used to validate tokens created by Auth Service.
  secret: ${JWT_SECRET}