server:
  port: 8082
spring:
  application:
    name: queue-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/queue_db}
    username: ${SPRING_DATASOURCE_USERNAME:queue_user}
    password: ${SPRING_DATASOURCE_PASSWORD:queue_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-change-this-in-production-min-256-bits}
