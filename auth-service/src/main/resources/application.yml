server:
  # Auth Service runs internally on port 8081.
  port: 8081

spring:
  application:
    # Service name used by Spring Boot.
    name: auth-service

  datasource:
    # Database connection values are provided by Docker Compose.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Creates or updates database tables during development.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # Hibernate SQL dialect for MySQL 8.
        dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  # Shared secret used to create and validate JWT tokens.
  secret: ${JWT_SECRET}

  # Token lifetime in milliseconds.
  expiration-ms: ${JWT_EXPIRATION_MS}

staff:
  seed:
    # Creates one STAFF account only when this value is true.
    enabled: ${STAFF_SEED_ENABLED:false}

    # Staff credentials are loaded from environment variables.
    username: ${STAFF_SEED_USERNAME:}
    email: ${STAFF_SEED_EMAIL:}
    password: ${STAFF_SEED_PASSWORD:}